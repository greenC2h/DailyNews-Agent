<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DailyNews 工作台</title><style>body{font-family:system-ui;max-width:1000px;margin:24px auto;padding:0 16px;background:#f5f7fb;color:#1f2937}section,header{background:#fff;border:1px solid #dbe2ea;border-radius:8px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,button{padding:9px;margin:4px;border:1px solid #cbd5e1;border-radius:5px;font:inherit}button{background:#0f766e;color:#fff;border:0}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header><h1>DailyNews</h1><p>个人新闻工作台</p></header><section id="auth"><h2>登录或注册</h2><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><input id="nickname" placeholder="昵称"><button onclick="register()">注册</button><button onclick="login()">登录</button><pre id="authOut"></pre></section><main id="app" hidden><div class="grid"><section><h2>问问助手</h2><textarea id="message" rows="4" style="width:90%" placeholder="输入新闻、任务或偏好请求"></textarea><button onclick="chat()">发送</button><pre id="chatOut"></pre></section><section><h2>订阅偏好</h2><input id="topics" placeholder="话题，逗号分隔"><input id="keywords" placeholder="关键词，逗号分隔"><input id="tz" value="Asia/Shanghai"><input id="push" type="time"><button onclick="save()">保存</button><pre id="settingsOut"></pre></section></div><section><h2>立即生成</h2><input id="query" placeholder="主题"><input id="start" type="datetime-local"><input id="end" type="datetime-local"><button onclick="create()">创建任务</button><pre id="taskOut"></pre></section><section><h2>最近简报</h2><button onclick="load()">刷新</button><div id="list"></div></section></main><script>const $=x=>document.getElementById(x),api=(p,o={})=>fetch('/api/v1'+p,{credentials:'include',headers:{'Content-Type':'application/json'},...o}).then(async r=>{let d=await r.json();if(!r.ok)throw d;return d});async function register(){try{await api('/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,nickname:$('nickname').value})});show()}catch(e){$('authOut').textContent=JSON.stringify(e)}}async function login(){try{await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});show()}catch(e){$('authOut').textContent=JSON.stringify(e)}}async function show(){ $('auth').hidden=true;$('app').hidden=false;let d=await api('/me');$('topics').value=d.topics.join(',');$('keywords').value=d.keywords.join(',');$('tz').value=d.timezone;load()}async function save(){try{$('settingsOut').textContent=JSON.stringify(await api('/settings',{method:'PATCH',body:JSON.stringify({topics:$('topics').value.split(',').filter(Boolean),keywords:$('keywords').value.split(',').filter(Boolean),timezone:$('tz').value,daily_push_time:$('push').value||null})}),null,2)}catch(e){$('settingsOut').textContent=JSON.stringify(e)}}async function create(){try{let d=await api('/news/briefings',{method:'POST',body:JSON.stringify({query:$('query').value,start:new Date($('start').value).toISOString(),end:new Date($('end').value).toISOString()})});$('taskOut').textContent=JSON.stringify(d);poll(d.id)}catch(e){$('taskOut').textContent=JSON.stringify(e)}}async function poll(id){let d=await api('/news/tasks/'+id);$('taskOut').textContent=JSON.stringify(d);if(['queued','running'].includes(d.status))setTimeout(()=>poll(id),2500);else load()}async function load(){try{let d=await api('/news/briefings');$('list').innerHTML=d.items.map(x=>`<p><b>${x.title}</b> · ${x.status} · <a href="/api/v1/news/briefings/${x.id}/html" target="_blank">查看</a> · <a href="/api/v1/news/briefings/${x.id}/download">下载</a></p>`).join('')||'暂无简报'}catch(e){}}async function chat(){let r=await fetch('/api/v1/chat/stream',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:$('message').value})});let reader=r.body.getReader(),dec=new TextDecoder();$('chatOut').textContent='';while(1){let x=await reader.read();if(x.done)break;for(let l of dec.decode(x.value).split('\n'))if(l.startsWith('data: ')&&l.slice(6)!=='[DONE]')$('chatOut').textContent+=JSON.parse(l.slice(6)).text||''}}api('/me').then(show).catch(()=>{});</script>
