<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DailyNews</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px}section{border:1px solid #ddd;padding:16px;margin:12px 0}input,button{padding:8px;margin:4px}pre{white-space:pre-wrap}</style><h1>DailyNews</h1><section><h2>账号</h2><input id="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><input id="nickname" placeholder="昵称"><button onclick="register()">注册</button><button onclick="login()">登录</button><button onclick="loadMe()">读取设置</button><pre id="out"></pre></section><section><h2>订阅设置</h2><input id="topics" placeholder="话题，逗号分隔"><input id="keywords" placeholder="关键词，逗号分隔"><input id="timezone" value="Asia/Shanghai"><input id="push" type="time"><button onclick="save()">保存</button></section><script>const out=document.querySelector('#out');const api=(p,o={})=>fetch('/api/v1'+p,{credentials:'include',headers:{'Content-Type':'application/json'},...o}).then(async r=>{const d=await r.json();if(!r.ok)throw d;return d});async function register(){try{out.textContent=JSON.stringify(await api('/auth/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,nickname:nickname.value})}),null,2)}catch(e){out.textContent=JSON.stringify(e)}}async function login(){try{out.textContent=JSON.stringify(await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})}),null,2)}catch(e){out.textContent=JSON.stringify(e)}}async function loadMe(){try{const d=await api('/me');topics.value=d.topics.join(',');keywords.value=d.keywords.join(',');timezone.value=d.timezone;push.value=d.daily_push_time||'';out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent=JSON.stringify(e)}}async function save(){try{out.textContent=JSON.stringify(await api('/settings',{method:'PATCH',body:JSON.stringify({topics:topics.value.split(',').map(x=>x.trim()).filter(Boolean),keywords:keywords.value.split(',').map(x=>x.trim()).filter(Boolean),timezone:timezone.value,daily_push_time:push.value||null})}),null,2)}catch(e){out.textContent=JSON.stringify(e)}}</script>
